[project]
name = "weatherindex-tools"
version = "0.1.0"
description = "Provider-accuracy analysis and data archival for the weatherindex.ai benchmark"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Adrià Arrufat" }]
dependencies = [
    "matplotlib>=3.8",
]

[project.scripts]
wxindex = "wxindex:main"
wxarchive = "archive:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["wxindex", "archive"]
